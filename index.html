<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wainscot Studio — Architectural Designer &amp; Carpentry Calculator</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header" id="app-header"></header>

      <div class="print-only-header">
        <div style="display:flex; justify-content:space-between; align-items:baseline;">
          <h1 style="font-size:18px;">Wainscot Studio — Workshop Plan</h1>
          <span id="print-date" style="font-size:12px; color:#475569;"></span>
        </div>
        <div id="print-wall-summary" style="font-size:12px; margin-top:4px; color:#334155;"></div>
      </div>

      <div class="workspace">
        <aside class="sidebar" id="app-sidebar"></aside>

        <main class="main-stage">
          <section class="canvas-section" id="canvas-section">
            <div class="canvas-toolbar">
              <div class="canvas-summary" id="canvas-summary"></div>
              <div class="canvas-tools">
                <label class="checkbox-row">
                  <input type="checkbox" id="chk-show-dims" checked />
                  <span>Dimensions</span>
                </label>
                <label class="checkbox-row">
                  <input type="checkbox" id="chk-show-shading" checked />
                  <span>Shading</span>
                </label>
                <button class="btn btn-sm" id="btn-zoom-out" type="button" title="Zoom Out">-</button>
                <button class="btn btn-sm" id="btn-zoom-reset" type="button" title="Reset Zoom">100%</button>
                <button class="btn btn-sm" id="btn-zoom-in" type="button" title="Zoom In">+</button>
              </div>
            </div>

            <div class="conflict-banner" id="conflict-banner" style="display:none;"></div>

            <div class="canvas-viewport">
              <svg id="elevation-svg" role="img" aria-label="Wall wainscoting elevation diagram"></svg>
            </div>
          </section>

          <section class="output-drawer" id="output-drawer"></section>
        </main>
      </div>
    </div>

    <div class="svg-tooltip" id="svg-tooltip"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
